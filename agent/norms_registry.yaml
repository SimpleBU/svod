# Реестр нормативных документов.
#
# Ведёт эксперт руками. Машина не выдумывает статусов: чего нет в этом файле,
# то показывается как «нет в реестре» — неверное «заменён» дороже честного
# «не знаю».
#
# status:
#   active      — действует
#   superseded  — заменён, чем именно — в replaced_by
#   cancelled   — отменён без прямой замены
#   verify      — требует проверки: документ старый, ведомственный или
#                 применяется добровольно. Портал показывает это как повод
#                 посмотреть глазами, а не как готовое замечание.
#
# Первичное наполнение собрано по пяти реальным томам объекта (ЭОМ, СПСиА,
# ПРК, ОВ1, АСУД) и ДОЛЖНО быть выверено экспертом перед первой реальной
# подачей: статусы меняются, а ответственность за замечание несёт человек.

