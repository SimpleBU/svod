{% if not doc %}
  <div class="empty">Ни один том ещё не разобран. Загрузите PDF на вкладке «Состав комплекта».</div>
{% else %}
<div class="docbar">
  {% for d in docs %}
    <a href="?tab=match&doc={{ d.id }}" class="{{ 'active' if d.id == doc.id }}">{{ d.cipher or d.filename }}</a>
  {% endfor %}
</div>
{% include '_match_panel.html' %}
{% endif %}
