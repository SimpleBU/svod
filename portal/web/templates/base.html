<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<!-- htmx лежит рядом, а не на CDN: у застройщика закрытый контур, да и
     ронять интерфейс из-за чужого домена незачем. Сборки всё равно нет. -->
<script src="/static/htmx.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="rail-brand" href="/" title="{{ APP_NAME }} — объекты">{{ APP_NAME }}</a>
    <div class="rail-foot">
      {% if user %}
        <span class="rail-user" title="{{ user.label }} · {{ ORG_NAME }}">{{ user.label|initials }}</span>
        <a class="rail-out" href="/logout" title="Выйти">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 2.5H3.5v11H6M9 5l3 3-3 3M12 8H6" stroke="currentColor"
                  stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="visually-hidden">Выйти</span>
        </a>
      {% endif %}
    </div>
  </aside>
  <main class="main">{% block main %}{% endblock %}</main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
