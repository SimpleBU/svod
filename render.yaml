# Блюпринт Render: веб, воркер, Postgres, Key Value — одним файлом.
# Ограничения площадки, под которые согнута архитектура:
#  1) постоянный диск монтируется только к одному сервису -> файлы в R2, не на диске;
#  2) free-инстанс 512 МБ не тянет разбор тома на 50 МБ -> воркеру 1c-2g;
#  3) free web service засыпает -> веб на платном плане.
envVarGroups:
  - name: svod-config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_NAME
        value: СВОД
      - key: ORG_NAME
        value: Внутренняя экспертиза
      - key: STORAGE_BACKEND
        value: s3
      - key: MAX_UPLOAD_MB
        value: "80"
      # значения ниже задаются в интерфейсе Render один раз (sync: false)
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PREFIX
        value: documents

services:
  - type: web
    name: svod-web
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn portal.web.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - fromGroup: svod-config
      - key: DATABASE_URL
        fromDatabase:
          name: svod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: svod-kv
          property: connectionString

  - type: worker
    name: svod-worker
    runtime: python
    # разбор тома на 150 листов А1 не влезает в 512 МБ: pymupdf держит страницу
    # и её геометрию в памяти. 2 ГБ — минимум, ниже воркер молча убивается по OOM.
    plan: 1c-2g
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m portal.worker
    envVars:
      - fromGroup: svod-config
      - key: DATABASE_URL
        fromDatabase:
          name: svod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: svod-kv
          property: connectionString

  - type: keyvalue
    name: svod-kv
    plan: free
    region: frankfurt
    ipAllowList: []   # доступ только изнутри Render

databases:
  - name: svod-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
